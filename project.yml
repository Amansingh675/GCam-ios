name: GCam
options:
  bundleIdPrefix: com.computational
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4" # Ensures backward compatibility with Xcode 15 and 16
targets:
  GCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.computational.gcam
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      TARGETED_DEVICE_FAMILY: "1" # iPhone
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGN_IDENTITY: ""
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
      INFOPLIST_PREPROCESS: YES
      SWIFT_VERSION: "5.9"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
