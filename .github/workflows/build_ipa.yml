name: Build GCam IPA for iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ipa:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Compile App Bundle with xcodebuild
        run: |
          xcodebuild -project GCam.xcodeproj \
            -scheme GCam \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into .IPA (Payload)
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/GCam.app Payload/
          zip -qr GCam.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCam-iPhone-15-Plus
          path: GCam.ipa
          retention-days: 7
