name: Build GCam IPA for iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode 16
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          else
            echo "Xcode 16 not found, checking all available Xcodes:"
            ls -d /Applications/Xcode*
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Compile App Bundle with xcodebuild
        run: |
          xcodebuild -project GCam.xcodeproj \
            -scheme GCam \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into .IPA (Payload)
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/GCam.app Payload/
          zip -qr GCam.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCam-iPhone-15-Plus
          path: GCam.ipa
          retention-days: 7
